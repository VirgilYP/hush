[package]
name = "hush-gui"
version = "0.2.0"
description = "A macOS-first UART and USB HID console with reusable command banks."
authors = ["Pawpaw Technology"]
edition = "2021"
publish = false

[lib]
name = "hush_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
hush = { path = "../../.." }
hidapi = { version = "2.6.6", features = ["macos-shared-device"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
