[package]
name = "hush"
version = "0.1.0"
edition = "2021"
description = "A prompt-aware wrapper for tio-style UART sessions with noisy device logs."
publish = false

[dependencies]
libc = "0.2"
serialport = "4.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
